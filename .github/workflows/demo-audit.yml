name: Demo React Native audit

on:
  pull_request:
    paths:
      - 'examples/react-native-audit-demo/**'
      - 'action/**'
      - 'action.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    # Secrets are unavailable to fork PRs. Run this demo workflow only for PRs
    # created inside the repository so it fails safely for external forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # `./` runs the action from this checkout, not the published release.
      # This workflow triggers on `action/**` changes, so it must exercise the
      # working tree — pinning to @v1.0.1 here would run the old published code
      # and silently pass a PR that broke the action.
      - uses: ./
        with:
          provider: openai
          model: gpt-5
          api-key: ${{ secrets.OPENAI_API_KEY }}
          budget-usd: '1.50'
          fail-on: never
