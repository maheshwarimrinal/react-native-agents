name: Demo React Native audit

on:
  pull_request:
    paths:
      - 'examples/react-native-audit-demo/**'
      - 'action/**'
      - 'action.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    # Secrets are unavailable to fork PRs. Run this demo workflow only for PRs
    # created inside the repository so it fails safely for external forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maheshwarimrinal/react-native-agents@v1.0.1
        with:
          provider: anthropic
          model: claude-sonnet-5
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          budget-usd: '1.50'
          fail-on: never
