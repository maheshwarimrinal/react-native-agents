name: Publish to npm

# Publishes when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Authentication is an npm trusted publisher (OIDC) bound to this repository and
# this workflow file, configured at npmjs.com → package → Settings → Trusted
# Publisher. No long-lived token is stored in repository secrets.
on:
  push:
    # Full semver tags only. 'v*' also matched the floating major tag, so every
    # `git push origin v1 --force` re-ran this workflow and failed the
    # tag-vs-package.json check ("Tag v1 does not match version 1.2.0") — a red
    # X on every release for a tag that is a pointer, not a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1. Older npm silently skips the
      # token exchange and fails with ENEEDAUTH instead.
      #
      # This used to be `npm install -g npm@latest`, which is a mutable
      # dependency resolved at run time in a job that holds `id-token: write`.
      # Whatever npm published most recently would have run with the OIDC
      # credential in scope. Two changes:
      #
      #   1. Use the npm that setup-node already pinned via `node-version: 24`
      #      whenever it meets the floor — on current Node 24 it does, so the
      #      normal path installs nothing at all.
      #   2. If it somehow does not, install one exact version rather than a
      #      floating tag.
      - name: Ensure npm supports trusted publishing
        env:
          NPM_FLOOR: 11.5.1
          NPM_PIN: 11.19.0
        run: |
          have=$(npm --version)
          lowest=$(printf '%s\n%s\n' "$have" "$NPM_FLOOR" | sort -V | head -n1)
          if [ "$lowest" = "$NPM_FLOOR" ]; then
            echo "bundled npm $have meets the $NPM_FLOOR floor — not installing anything"
          else
            echo "bundled npm $have is below $NPM_FLOOR; installing pinned npm@$NPM_PIN"
            npm install -g "npm@$NPM_PIN"
          fi
          npm --version

      # No dependencies by design, so there is nothing to install.
      - name: Verify dist/ is in sync with agents/
        run: node scripts/build.mjs --check

      - name: Run test suite
        run: node scripts/test.mjs

      - name: Run Action tests
        run: node action/test.mjs

      - name: Validate eval definitions
        # Catches fixtures that call helpers they never define — a gap that a
        # tag-triggered publish could otherwise bypass entirely.
        run: node evals/run.mjs --validate

      - name: Verify the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Inspect the tarball
        run: |
          npm pack --dry-run
          echo "--- files that will ship ---"
          npm pack --dry-run --json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              // npm <= 11 emits an array; npm 12 emits an object keyed by package name.
              const j=JSON.parse(d);
              const f=Array.isArray(j)?j[0]:Object.values(j)[0];
              console.log('name:', f.name, f.version);
              console.log('files:', f.entryCount, '| unpacked:', (f.unpackedSize/1024/1024).toFixed(2)+'MB');
            });"

      # Authentication comes from the npm trusted publisher (OIDC) configured for
      # this package, using the id-token permission above. No NPM_TOKEN secret is
      # involved, and provenance is attested from the workflow identity.
      - name: Publish
        id: publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public

      # The summary said "Published" unconditionally, so a manual dry run — whose
      # whole purpose is to confirm nothing was published — reported a release
      # that never happened. It now reads the publish step's own outcome.
      - name: Summary
        if: success()
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            {
              echo "### Published \`$N@$V\`"
              echo ""
              echo '```bash'
              echo "npx $N@$V install"
              echo '```'
              echo ""
              echo "https://www.npmjs.com/package/$N"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dry run — \`$N@$V\` was **not** published"
              echo ""
              echo "Every check and the tarball inspection ran. Re-run with"
              echo "\`dry_run: false\`, or push a \`v$V\` tag, to publish."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
