name: React Native Audit
description: >-
  React Native PR review for performance, security, quality, accessibility,
  testing, and release.
author: Mrinal Maheshwari

branding:
  icon: smartphone
  color: blue

inputs:
  api-key:
    description: >-
      Anthropic or OpenAI API key. Runs in your CI with your key — no data goes
      to any third party beyond your chosen model provider.

      Not marked required, because there are three supported ways to supply it
      and two cases that need no key at all. Passing it here is the usual one;
      alternatively set ANTHROPIC_API_KEY or OPENAI_API_KEY in the job's `env`,
      and the run picks up whichever matches the chosen provider. `dry-run: true`
      makes no model call, and `provider: mock` calls nothing — both work with no
      key. A real run with no key anywhere still fails, with a message naming the
      variable it looked for.
    required: false

  provider:
    description: 'anthropic | openai | mock'
    required: false
    default: anthropic

  model:
    description: 'Model id. Defaults to claude-sonnet-5 (anthropic) or gpt-5 (openai).'
    required: false
    default: ''

  agents:
    description: >-
      Comma-separated agent ids to force. Any of the 18 review agents:
      rn-animation, rn-background, rn-code-quality, rn-native-modules, rn-navigation,
      rn-observability, rn-offline, rn-payments, rn-performance,
      rn-permissions, rn-platform-parity, rn-push, rn-release, rn-security,
      rn-state, rn-testing, rn-ui-accessibility, rn-upgrade.
      Leave empty to auto-route based on which files changed — recommended,
      and typically 60-70% cheaper.
    required: false
    default: ''

  max-agents:
    description: 'Cap how many agents may run on one PR. Cost control.'
    required: false
    default: '6'

  budget-usd:
    description: >-
      Estimated preflight budget per run, in USD. Before each call the run
      estimates its cost from token counts and published prices; when the
      running estimate would exceed this, it stops cleanly and reports what it
      managed to review. It is not a hard cap: token counts are estimated, an
      in-flight call is not interrupted, and a model missing from the price
      table is priced by a conservative fallback. Treat it as a brake, not a
      guarantee — set provider-side spend limits for anything you must not
      exceed.
    required: false
    default: '2'

  fail-on:
    description: 'Fail the check when a finding at this severity or worse appears: P0 | P1 | P2 | P3 | never'
    required: false
    default: never

  fail-on-error:
    description: >-
      Fail the check when an agent errors or the budget cap stops the run early.
      Defaults to true: an audit where agents failed reviewed nothing, and a
      green check that means "we did not actually look" is worse than a red one.
      Set to false to accept partial coverage.
    required: false
    default: 'true'

  dry-run:
    description: 'Route and report which agents would run, without calling the model.'
    required: false
    default: 'false'

  github-token:
    description: 'Token used to read the PR diff and post comments.'
    required: false
    default: ${{ github.token }}

outputs:
  total:
    description: 'Total findings.'
    value: ${{ steps.audit.outputs.total }}
  p0:
    description: 'Count of P0 (critical) findings.'
    value: ${{ steps.audit.outputs.p0 }}
  p1:
    description: 'Count of P1 (high) findings.'
    value: ${{ steps.audit.outputs.p1 }}
  p2:
    description: 'Count of P2 findings.'
    value: ${{ steps.audit.outputs.p2 }}
  p3:
    description: 'Count of P3 findings.'
    value: ${{ steps.audit.outputs.p3 }}
  cost-usd:
    description: 'Estimated USD spent on this run.'
    value: ${{ steps.audit.outputs.cost-usd }}
  agents:
    description: 'Comma-separated agent ids that actually ran.'
    value: ${{ steps.audit.outputs.agents }}
  errors:
    description: 'Number of agents that failed.'
    value: ${{ steps.audit.outputs.errors }}
  agents-failed:
    description: 'Comma-separated ids of agents that errored.'
    value: ${{ steps.audit.outputs.agents-failed }}
  coverage-gaps:
    description: >-
      Number of distinct reasons part of this pull request was not reviewed —
      files GitHub returned no patch for, the 3,000-file listing cap, or files
      dropped from a prompt at its size limit. Non-zero means the findings
      describe only part of the diff.
    value: ${{ steps.audit.outputs.coverage-gaps }}
  budget-hit:
    description: 'true when the budget cap stopped the run before every agent had run.'
    value: ${{ steps.audit.outputs.budget-hit }}
  findings-json:
    description: 'All findings as a JSON array.'
    value: ${{ steps.audit.outputs.findings-json }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 20

    # Zero dependencies by design — nothing to install.
    - name: Run React Native audit
      id: audit
      shell: bash
      run: node "${{ github.action_path }}/action/index.mjs"
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_AGENTS: ${{ inputs.agents }}
        INPUT_MAX_AGENTS: ${{ inputs.max-agents }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
