# Drop this in .github/workflows/rn-audit.yml in your React Native repo.
#
# Add one provider key as a repository secret:
#   ANTHROPIC_API_KEY for Anthropic (default), or OPENAI_API_KEY for OpenAI.
#   Settings → Secrets and variables → Actions → New repository secret
name: React Native audit

on:
  pull_request:
    # Only run when code that matters actually changed — the action routes
    # further internally, but this avoids spinning up a runner for a README edit.
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.kt'
      - '**/*.swift'
      - '**/*.mm'
      - '**/*.gradle'
      - '**/Info.plist'
      - '**/AndroidManifest.xml'
      - '**/package.json'
      - '**/app.json'
      - '**/app.config.*'
      - '**/eas.json'

permissions:
  contents: read
  pull-requests: write # required to post review comments

# A new push supersedes the previous audit — don't pay for stale reviews.
concurrency:
  group: rn-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Fork PRs can't read secrets, and running without a key just fails noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: maheshwarimrinal/react-native-agents@v1.1.0
        with:
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Stop the run cleanly rather than overspending on a huge PR.
          budget-usd: '1.50'

          # Start with `never` while you calibrate, then tighten to P0 once the
          # team trusts the signal. Gating too early trains people to ignore it.
          fail-on: never

          # Leave this on. If an agent errors — bad key, no credits, provider
          # outage — the run produces zero findings, which looks identical to a
          # clean diff. Failing loudly is the point.
          fail-on-error: true

          # Optional: force a specific agent set instead of auto-routing.
          # Auto-routing is usually cheaper — it picks only the specialists the
          # changed files warrant.
          # agents: rn-security,rn-performance,rn-native-modules

          # For OpenAI, use instead:
          # provider: openai
          # model: gpt-5
          # api-key: ${{ secrets.OPENAI_API_KEY }}

  # Deterministic bundle-size check. No model call, no API key, no cost —
  # so it can run on every pull request regardless of your audit budget.
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - run: npm ci

      - name: Check bundle size against the base branch
        run: |
          npx @maheshwarimrinal/react-native-agents size \
            --base "origin/${{ github.base_ref }}" \
            --budget-delta 150kb
